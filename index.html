    <script>
      // AI Studio Environment Constraint: HMR is disabled. Ignore WebSocket errors.
      window.addEventListener('unhandledrejection', function (event) {
        var msg = String(event?.reason?.message || event?.reason || '');
        if (msg.includes('WebSocket') || msg.includes('vite:ws') || msg.includes('vite-hmr')) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = String(event?.message || '');
        var file = String(event?.filename || '');
        if (msg.includes('WebSocket') || file.includes('@vite/client')) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
